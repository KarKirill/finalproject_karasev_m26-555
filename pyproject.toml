[project]
name = "finalproject-karasev-m26-555"
version = "0.1.0"
description = "Currency trading simulation console application"
readme = "README.md"
authors = [
    { name = "KarKirill", email = "karasevkirill2004@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.12.0",
    "requests>=2.32.0",
]

[project.scripts]
project = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]